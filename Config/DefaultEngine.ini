[CoreRedirects]
; The QuantumCharacter pack was moved into ThirdParty/ without fixing up
; redirectors, so its skeletal meshes and every animation still point at the old
; /Game/QuantumCharacter/... path. That reference is stored as a string inside the
; assets, so moving the files did not update it: the skeleton failed to load, and
; with a null skeleton none of the infantry animations could play. One substring
; redirect repairs every reference in the pack without duplicating any asset.
