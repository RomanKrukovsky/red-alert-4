; Physical light units. The map's sun is 75,000 lux, which is the right value for
; a SkyAtmosphere sun but is far outside the engine's legacy exposure range -- and
; outside it, every lit pixel clamps at the top and the game renders as a white
; screen with nothing visible. This is the setting UE5's own templates ship with;
; the project simply had no RendererSettings section at all, so it was running on
; the pre-5.0 default.
