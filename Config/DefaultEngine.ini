[CoreRedirects]
; The QuantumCharacter pack was moved into ThirdParty/ without fixing up
; redirectors, so its skeletal meshes and every animation still point at the old
; /Game/QuantumCharacter/... path. That reference is stored as a string inside the
; assets, so moving the files did not update it: the skeleton failed to load, and
; with a null skeleton none of the infantry animations could play. One substring
; redirect repairs every reference in the pack without duplicating any asset.
+PackageRedirects=(OldName="/Game/QuantumCharacter/",NewName="/Game/ThirdParty/QuantumCharacter/",MatchSubstring=true)

; CityPark was moved into ThirdParty/ the same way and has the same breakage: 524
; meshes under /Game/ThirdParty/CityPark/Meshes/ named their materials at
; /Game/CityPark/Materials/..., and those materials in turn named textures and
; master materials at /Game/CityPark/Textures/... and /Game/CityPark/Materials/...,
; none of which exist any more. Opening any level that uses the pack logged
; LoadErrors and the meshes rendered untextured, which was visible on the
; archipelago skirmish map. One substring redirect repairs every depth of that
; chain without touching or duplicating a single asset.
;
; MatchSubstring is deprecated in UE 5.8 in favour of MatchWildcard, but the
; wildcard form was tried and does not work here: '/Game/CityPark/*' is rejected
; with "failed to parse OldName for wildcard redirect", and the ellipsis form
; '/Game/CityPark/...' parses yet stops redirecting, bringing all 17 LoadErrors
; back. Keeping the working, deprecated form and accepting one startup warning is
; the honest trade until the wildcard syntax is understood.
+PackageRedirects=(OldName="/Game/CityPark/",NewName="/Game/ThirdParty/CityPark/",MatchSubstring=true)

