# Fast gate on every push: the engine-free simulation core.
name: core

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main, feature/* ]

jobs:
  repository-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject unsafe tracked paths and legacy React UI
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B - <<'PY'
          import subprocess
          import sys

          paths = [
              path.decode("utf-8", "surrogateescape")
              for path in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
              if path
          ]

          failures = []
          paths_by_casefold = {}
          for path in paths:
              folded_path = path.casefold()
              previous_path = paths_by_casefold.setdefault(folded_path, path)
              if previous_path != path:
                  failures.append(
                      "case-fold collision: " + previous_path + " <-> " + path
                  )

          bytecode_paths = [path for path in paths if path.lower().endswith(".pyc")]
          if bytecode_paths:
              failures.append("tracked Python bytecode: " + ", ".join(bytecode_paths))

          legacy_react_paths = [
              path
              for path in paths
              if path.casefold() == "ra4-ui" or path.casefold().startswith("ra4-ui/")
          ]
          if legacy_react_paths:
              failures.append("legacy ra4-ui path is still tracked: " + ", ".join(legacy_react_paths))

          if failures:
              print("Repository hygiene check failed:", file=sys.stderr)
              print("\\n".join("- " + failure for failure in failures), file=sys.stderr)
              raise SystemExit(1)

          print("Repository hygiene check passed.")
          PY

      - name: Run Compliance Unit Tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s build/Compliance/tests -p "test_*.py" -v

      - name: Run Blocking Compliance Scanner
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 build/Compliance/compliance_scan.py --scope index

  headless:
    name: Headless Simulation (${{ matrix.os }})
    needs: [repository-hygiene]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S Tools/HeadlessBuild -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Extract Determinism Checksum (Bash)
        if: runner.os != 'Windows'
        run: |
          ./build/RA4Tests --filter=VerticalSlice.FullMatch | tee raw_out.txt
          grep -Eo 'final checksum [0-9A-Fa-f]+' raw_out.txt | tail -n 1 | awk '{print $3}' > checksum-${{ matrix.os }}.txt
          test -s checksum-${{ matrix.os }}.txt

      - name: Extract Determinism Checksum (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          build\Release\RA4Tests.exe --filter=VerticalSlice.FullMatch | Tee-Object -FilePath raw_out.txt
          $match = Select-String -Path raw_out.txt -Pattern 'final checksum ([0-9A-Fa-f]+)' | Select-Object -Last 1
          if (-not $match) { throw 'Missing final checksum in VerticalSlice.FullMatch output.' }
          $match.Matches[0].Groups[1].Value | Out-File -FilePath checksum-${{ matrix.os }}.txt -Encoding ascii -NoNewline

      - name: Upload Checksum Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ matrix.os }}
          path: checksum-${{ matrix.os }}.txt

  compare-checksums:
    name: Cross-Platform Determinism Verification
    needs: [headless]
    runs-on: ubuntu-latest
    steps:
      - name: Download Ubuntu Checksum
        uses: actions/download-artifact@v4
        with:
          name: checksum-ubuntu-latest
          path: ubuntu

      - name: Download macOS Checksum
        uses: actions/download-artifact@v4
        with:
          name: checksum-macos-latest
          path: macos

      - name: Download Windows Checksum
        uses: actions/download-artifact@v4
        with:
          name: checksum-windows-latest
          path: windows

      - name: Verify Cross-Platform Checksum Identity
        run: |
          UBUNTU_SUM=$(cat ubuntu/checksum-ubuntu-latest.txt)
          MACOS_SUM=$(cat macos/checksum-macos-latest.txt)
          WINDOWS_SUM=$(cat windows/checksum-windows-latest.txt)
          echo "Ubuntu:  $UBUNTU_SUM"
          echo "macOS:   $MACOS_SUM"
          echo "Windows: $WINDOWS_SUM"
          if [ "$UBUNTU_SUM" != "$MACOS_SUM" ] || [ "$UBUNTU_SUM" != "$WINDOWS_SUM" ]; then
            echo "ERROR: Cross-platform determinism mismatch detected between OS builds!"
            exit 1
          fi
          echo "VERIFIED: Determinism checksums match identically across Ubuntu, macOS, and Windows."

  sanitizers:
    name: ASan & UBSan Check (Linux)
    needs: [repository-hygiene]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with ASan and UBSan
        run: >
          cmake -S Tools/HeadlessBuild -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-san -j
      - name: Run Sanitized Tests
        run: ./build-san/RA4Tests
