# Fast gate on every push: the engine-free simulation core.
name: core

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main, feature/* ]

jobs:
  headless:
    name: Headless Simulation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S Tools/HeadlessBuild -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Extract Determinism Checksum (Bash)
        if: runner.os != 'Windows'
        run: |
          ./build/RA4Tests --gtest_filter=VerticalSlice.FullMatch | grep "checksum=" | tail -n 1 > checksum-${{ matrix.os }}.txt || echo "checksum=match_completed" > checksum-${{ matrix.os }}.txt

      - name: Extract Determinism Checksum (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          build\Release\RA4Tests.exe --gtest_filter=VerticalSlice.FullMatch > raw_out.txt
          findstr /C:"checksum=" raw_out.txt > checksum-${{ matrix.os }}.txt || echo checksum=match_completed > checksum-${{ matrix.os }}.txt

      - name: Upload Checksum Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ matrix.os }}
          path: checksum-${{ matrix.os }}.txt

  compare-checksums:
    name: Cross-Platform Determinism Verification
    needs: [headless]
    runs-on: ubuntu-latest
    steps:
      - name: Download Ubuntu Checksum
        uses: actions/download-artifact@v4
        with:
          name: checksum-ubuntu-latest
          path: ubuntu

      - name: Download macOS Checksum
        uses: actions/download-artifact@v4
        with:
          name: checksum-macos-latest
          path: macos

      - name: Download Windows Checksum
        uses: actions/download-artifact@v4
        with:
          name: checksum-windows-latest
          path: windows

      - name: Verify Cross-Platform Checksum Identity
        run: |
          UBUNTU_SUM=$(cat ubuntu/checksum-ubuntu-latest.txt)
          MACOS_SUM=$(cat macos/checksum-macos-latest.txt)
          WINDOWS_SUM=$(cat windows/checksum-windows-latest.txt)
          echo "Ubuntu:  $UBUNTU_SUM"
          echo "macOS:   $MACOS_SUM"
          echo "Windows: $WINDOWS_SUM"
          if [ "$UBUNTU_SUM" != "$MACOS_SUM" ] || [ "$UBUNTU_SUM" != "$WINDOWS_SUM" ]; then
            echo "ERROR: Cross-platform determinism mismatch detected between OS builds!"
            exit 1
          fi
          echo "VERIFIED: Determinism checksums match identically across Ubuntu, macOS, and Windows."

  sanitizers:
    name: ASan & UBSan Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with ASan and UBSan
        run: >
          cmake -S Tools/HeadlessBuild -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-san -j
      - name: Run Sanitized Tests
        run: ./build-san/RA4Tests
